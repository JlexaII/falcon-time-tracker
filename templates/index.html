<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TimeTrack — учёт рабочего времени</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main><header><div class="brand">◷ TimeTrack</div><p>Учёт рабочего времени сотрудников · тестовый проект</p></header>
<section class="grid"><article class="panel"><h2>Сотрудники</h2><form id="employee-form"><label for="employee-name">Имя сотрудника</label><div class="inline"><input id="employee-name" maxlength="100" required placeholder="Например, Анна Иванова"><button>Добавить</button></div></form><ul id="employees"></ul></article>
<article class="panel"><h2>Новая задача</h2><form id="timer-form"><label for="employee-select">Сотрудник</label><select id="employee-select" required></select><label for="description">Описание задачи</label><input id="description" placeholder="Например, разработка интерфейса" maxlength="500" required><button class="primary">▶ Запустить таймер</button></form></article></section>
<section class="panel"><h2>Активные таймеры</h2><div id="active"></div></section>
<section class="panel"><h2>Отчёт за период <small>Время в UTC</small></h2><form id="report-form" class="dates"><label>С <input type="date" id="from" required></label><label>По <input type="date" id="to" required></label><button>Показать отчёт</button></form><h3>Итого по сотрудникам</h3><div id="totals"></div><h3>Записи</h3><div class="tablewrap"><table><thead><tr><th>Сотрудник</th><th>Задача</th><th>Начало (UTC)</th><th>Окончание (UTC)</th><th>В периоде</th></tr></thead><tbody id="entries"></tbody></table></div></section><div id="message" role="status" aria-live="polite"></div></main><script src="/static/app.js"></script></body></html>
